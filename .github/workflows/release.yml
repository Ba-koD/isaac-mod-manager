name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "*.*.*"
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: isaac-mod-manager.exe
            asset_name: isaac-mod-manager-windows.exe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          version=$(grep '^version = ' Cargo.toml | head -n 1 | sed -E 's/version = "([^"]+)"/\1/')
          tag_name="v${version}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            test "${version}" = "${GITHUB_REF_NAME}" || test "v${version}" = "${GITHUB_REF_NAME}"
            tag_name="${GITHUB_REF_NAME}"
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${tag_name}" >> "${GITHUB_OUTPUT}"

      - name: Create version tag
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          tag_name="${{ steps.release.outputs.tag_name }}"
          existing_ref=$(git ls-remote --tags origin "refs/tags/${tag_name}" | awk '{print $1}')
          peeled_ref=$(git ls-remote --tags origin "refs/tags/${tag_name}^{}" | awk '{print $1}')
          tag_target="${peeled_ref:-$existing_ref}"

          if [[ -n "${tag_target}" && "${tag_target}" != "${GITHUB_SHA}" ]]; then
            echo "Tag ${tag_name} already exists at ${tag_target}, not ${GITHUB_SHA}."
            exit 1
          fi

          if [[ -z "${tag_target}" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag_name}" -m "${tag_name}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag_name}"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
          tag_name: ${{ steps.release.outputs.tag_name }}
          name: ${{ steps.release.outputs.tag_name }}
          body: |
            Tagged commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            Download `${{ matrix.asset_name }}` from the assets below.
          prerelease: false
          overwrite_files: true

      - name: Update latest tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin --force refs/tags/latest
