name: Release

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: isaac-mod-manager.exe
            asset_name: isaac-mod-manager-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          version=$(grep '^version = ' Cargo.toml | head -n 1 | sed -E 's/version = "([^"]+)"/\1/')
          test "${version}" = "${GITHUB_REF_NAME}" || test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ matrix.asset_name }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Tagged commit: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}

            Download `${{ matrix.asset_name }}` from the assets below.
          prerelease: false
          overwrite_files: true
